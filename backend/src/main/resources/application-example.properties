# Server Configuration
server.port=8080

# Database Configuration (Replace with production values or use env vars)
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:smart_campus_360}
spring.datasource.username=${DB_USERNAME:your_username}
spring.datasource.password=${DB_PASSWORD:your_password}

# JWT Secret (Should be a 256-bit hexadecimal string)
jwt.secret=${JWT_SECRET:your_jwt_secret_hex_string}
jwt.expiration-ms=86400000
