# Server Configuration
server.port=${PORT:8080}
server.address=0.0.0.0
server.servlet.context-path=/

# Active Profile (Default to H2 for local testing; change to 'mysql' for production)
spring.profiles.active=h2

# Database Configuration Default Fallback
spring.datasource.url=jdbc:h2:mem:smartcampusdb;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration
jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
jwt.expiration-ms=86400000

# Enable H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# Jackson Configuration
spring.jackson.serialization.fail-on-empty-beans=false

# SmartTools Configurations
smarttools.max-file-size-bytes=20971520
smarttools.converter.enabled=true
smarttools.converter.libreoffice-path=${SMARTTOOLS_LIBREOFFICE_PATH:}
smarttools.converter.timeout-seconds=60
