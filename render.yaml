services:
  # MySQL Private Service
  - type: pserv
    name: smart-campus-mysql
    runtime: image
    image:
      url: docker.io/library/mysql:8.0
    disk:
      name: mysql-data
      mountPath: /var/lib/mysql
      sizeGB: 10
    envVars:
      - key: MYSQL_DATABASE
        value: smart_campus_360
      - key: MYSQL_USER
        value: smart_user
      - key: MYSQL_PASSWORD
        generateValue: true
      - key: MYSQL_ROOT_PASSWORD
        generateValue: true

  # Backend Web Service
  - type: web
    name: smart-campus-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: mysql
      - key: DB_HOST
        fromService:
          type: pserv
          name: smart-campus-mysql
          property: host
      - key: DB_PORT
        value: "3306"
      - key: DB_NAME
        value: smart_campus_360
      - key: DB_USERNAME
        value: smart_user
      - key: DB_PASSWORD
        fromService:
          type: pserv
          name: smart-campus-mysql
          envVarKey: MYSQL_PASSWORD
      - key: JWT_SECRET
        generateValue: true
      - key: SMARTTOOLS_LIBREOFFICE_PATH
        value: /usr/bin/soffice

  # Frontend Web Service
  - type: web
    name: smart-campus-frontend
    runtime: docker
    rootDir: frontend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: BACKEND_URL
        fromService:
          type: web
          name: smart-campus-backend
          property: hostport
      - key: NGINX_ENVSUBST_FILTER
        value: BACKEND_URL
