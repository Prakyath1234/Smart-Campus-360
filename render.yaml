services:
  - type: web
    name: smart-campus-360
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: h2
      - key: JWT_SECRET
        generateValue: true
      - key: SMARTTOOLS_LIBREOFFICE_PATH
        value: /usr/bin/soffice
