version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: smart-campus-mysql
    restart: always
    environment:
      MYSQL_DATABASE: smart_campus_360
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/1-schema.sql
      - ./database/sample-data.sql:/docker-entrypoint-initdb.d/2-sample-data.sql

  app:
    image: openjdk:21-slim
    container_name: smart-campus-app
    restart: on-failure
    depends_on:
      - db
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/smart_campus_360?useSSL=false&allowPublicKeyRetrieval=true
      DB_USERNAME: root
      DB_PASSWORD: root
      JWT_SECRET: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
    volumes:
      - ./backend/target/smart-campus-360-1.0.0-SNAPSHOT.jar:/app.jar
    entrypoint: ["java", "-jar", "/app.jar"]

volumes:
  mysql-data:
