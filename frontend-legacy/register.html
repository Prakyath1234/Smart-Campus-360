<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Campus 360 - Register</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 0;
        }
        .register-card {
            width: 100%;
            max-width: 600px;
            border: none;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            border-radius: 12px;
        }
    </style>
</head>
<body>

    <div class="card register-card p-4">
        <div class="text-center mb-4">
            <h3 class="fw-bold text-primary">SMART CAMPUS 360</h3>
            <p class="text-muted">Create your new portal account</p>
        </div>

        <div id="errorAlert" class="alert alert-danger d-none" role="alert"></div>

        <form id="registerForm">
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label for="name" class="form-label">Full Name</label>
                    <input type="text" class="form-control" id="name" required placeholder="John Doe">
                </div>
                <div class="col-md-6 mb-3">
                    <label for="email" class="form-label">Email Address</label>
                    <input type="email" class="form-control" id="email" required placeholder="john@smartcampus.com">
                </div>
            </div>

            <div class="row">
                <div class="col-md-6 mb-3">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" class="form-control" id="password" required placeholder="Min 6 characters">
                </div>
                <div class="col-md-6 mb-3">
                    <label for="phone" class="form-label">Phone Number</label>
                    <input type="text" class="form-control" id="phone" placeholder="9876543210">
                </div>
            </div>

            <div class="mb-3">
                <label for="role" class="form-label">Select Portal Role</label>
                <select class="form-select" id="role" required>
                    <option value="" disabled selected>Choose role...</option>
                    <option value="STUDENT">STUDENT</option>
                    <option value="FACULTY">FACULTY</option>
                    <option value="SECURITY">SECURITY STAFF</option>
                    <option value="ADMIN">ADMINISTRATOR</option>
                </select>
            </div>

            <!-- Student specific fields -->
            <div id="studentFields" class="d-none border p-3 rounded mb-3 bg-light">
                <h6 class="fw-bold text-primary mb-3">Student Information</h6>
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="rollNumber" class="form-label">Roll Number</label>
                        <input type="text" class="form-control" id="rollNumber" placeholder="CS2026001">
                    </div>
                    <div class="col-md-6 mb-3">
                        <label for="semester" class="form-label">Current Semester</label>
                        <input type="number" class="form-control" id="semester" min="1" max="8" value="1">
                    </div>
                </div>
                <div class="mb-3">
                    <label for="studentDept" class="form-label">Academic Department</label>
                    <select class="form-select dept-dropdown" id="studentDept">
                        <option value="" disabled selected>Loading departments...</option>
                    </select>
                </div>
            </div>

            <!-- Faculty specific fields -->
            <div id="facultyFields" class="d-none border p-3 rounded mb-3 bg-light">
                <h6 class="fw-bold text-primary mb-3">Faculty Information</h6>
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="employeeId" class="form-label">Employee ID</label>
                        <input type="text" class="form-control" id="employeeId" placeholder="EMP2026101">
                    </div>
                    <div class="col-md-6 mb-3">
                        <label for="designation" class="form-label">Designation</label>
                        <input type="text" class="form-control" id="designation" placeholder="e.g. Assistant Professor">
                    </div>
                </div>
                <div class="mb-3">
                    <label for="facultyDept" class="form-label">Faculty Department</label>
                    <select class="form-select dept-dropdown" id="facultyDept">
                        <option value="" disabled selected>Loading departments...</option>
                    </select>
                </div>
            </div>

            <button type="submit" id="submitBtn" class="btn btn-primary w-100 py-2 fw-bold">
                <span id="btnText">Register Account</span>
                <span id="btnSpinner" class="spinner-border spinner-border-sm d-none" role="status" aria-hidden="true"></span>
            </button>
        </form>

        <div class="text-center mt-4">
            <p class="mb-0 text-muted">Already have an account? <a href="login.html" class="fw-bold">Sign In</a></p>
            <a href="index.html" class="d-block mt-2 text-decoration-none">Back to Home</a>
        </div>
    </div>

    <!-- Centered API helper -->
    <script src="js/api.js"></script>
    <script>
        // Load Departments on load
        window.addEventListener('DOMContentLoaded', async () => {
            try {
                const depts = await API.get('/api/auth/departments');
                const dropdowns = document.querySelectorAll('.dept-dropdown');
                
                dropdowns.forEach(dropdown => {
                    dropdown.innerHTML = '<option value="" disabled selected>Choose department...</option>';
                    depts.forEach(dept => {
                        dropdown.innerHTML += `<option value="${dept.id}">${dept.name} (${dept.code})</option>`;
                    });
                });
            } catch (error) {
                console.error("Failed to load departments during registration:", error);
                const dropdowns = document.querySelectorAll('.dept-dropdown');
                dropdowns.forEach(dropdown => {
                    dropdown.innerHTML = '<option value="">No departments available (run migrations)</option>';
                });
            }
        });

        // Toggle Fields based on Role Selection
        document.getElementById('role').addEventListener('change', function(e) {
            const role = e.target.value;
            const studentFields = document.getElementById('studentFields');
            const facultyFields = document.getElementById('facultyFields');

            studentFields.classList.add('d-none');
            facultyFields.classList.add('d-none');

            if (role === 'STUDENT') {
                studentFields.classList.remove('d-none');
            } else if (role === 'FACULTY') {
                facultyFields.classList.remove('d-none');
            }
        });

        // Submit form
        document.getElementById('registerForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const errorAlert = document.getElementById('errorAlert');
            const submitBtn = document.getElementById('submitBtn');
            const btnText = document.getElementById('btnText');
            const btnSpinner = document.getElementById('btnSpinner');

            const name = document.getElementById('name').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const phone = document.getElementById('phone').value.trim();
            const role = document.getElementById('role').value;

            // Form Payload mapping
            const payload = { name, email, password, phone, role };

            if (role === 'STUDENT') {
                payload.rollNumber = document.getElementById('rollNumber').value.trim();
                payload.semester = parseInt(document.getElementById('semester').value);
                const studentDept = document.getElementById('studentDept').value;
                if (studentDept) {
                    payload.departmentId = parseInt(studentDept);
                }
            } else if (role === 'FACULTY') {
                payload.employeeId = document.getElementById('employeeId').value.trim();
                payload.designation = document.getElementById('designation').value.trim();
                const facultyDept = document.getElementById('facultyDept').value;
                if (facultyDept) {
                    payload.departmentId = parseInt(facultyDept);
                }
            }

            // Client side validation
            if (password.length < 6) {
                errorAlert.textContent = "Password must be at least 6 characters.";
                errorAlert.classList.remove('d-none');
                return;
            }

            errorAlert.classList.add('d-none');
            submitBtn.disabled = true;
            btnText.textContent = "Creating Account...";
            btnSpinner.classList.remove('d-none');

            try {
                const response = await API.post('/api/auth/register', payload);
                
                // Store authentication metadata
                localStorage.setItem('token', response.token);
                localStorage.setItem('email', response.email);
                localStorage.setItem('role', response.role);
                localStorage.setItem('name', response.name);
                localStorage.setItem('userId', response.userId);
                if (response.profileId) {
                    localStorage.setItem('profileId', response.profileId);
                }

                // Redirect to dashboard
                API.redirectToDashboard(response.role);

            } catch (error) {
                errorAlert.textContent = error.message || "Registration failed. Verify input and retry.";
                errorAlert.classList.remove('d-none');
            } finally {
                submitBtn.disabled = false;
                btnText.textContent = "Register Account";
                btnSpinner.classList.add('d-none');
            }
        });
    </script>
</body>
</html>
